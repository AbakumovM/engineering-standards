# Контракты границ (DEP-01…DEP-06). Заменить `app` на пакет, `assets` — на домен.
# Каждый новый контракт проверить пробным нарушением: lint-imports должен упасть.
# Исключение — в ignore_imports с комментарием «зачем и когда снимется».

[importlinter]
root_package = app

# --- на каждый домен ----------------------------------------------------------

[importlinter:contract:assets-layers]
name = assets: слои направлены внутрь
type = layers
layers =
    app.assets.controllers | app.assets.ioc
    app.assets.adapters
    app.assets.application
    app.assets.domain

[importlinter:contract:assets-core]
name = assets: domain и application без инфраструктуры
type = forbidden
source_modules =
    app.assets.domain
    app.assets.application
forbidden_modules =
    app.infrastructure
    sqlalchemy
    asyncpg
    httpx
    fastapi
    aiogram
    faststream
    dishka

[importlinter:contract:assets-public]
name = assets: соседи — только через public
type = protected
protected_modules =
    app.assets.domain
    app.assets.application
    app.assets.adapters
    app.assets.controllers
allowed_importers =
    app.assets
    app.api_main

# --- на весь пакет ------------------------------------------------------------

[importlinter:contract:domain-pure]
name = domain ни от чего не зависит
type = forbidden
source_modules =
    app.assets.domain
forbidden_modules =
    pydantic
    pydantic_settings

# При переносе старого кода:
# [importlinter:contract:legacy-boundary]
# name = новый код не импортирует старый
# type = forbidden
# source_modules =
#     app.assets
# forbidden_modules =
#     app.legacy_module
# ignore_imports =
#     # Карточка пользователя — до переноса backoffice.
#     app.assets.controllers.bot -> app.legacy_module
